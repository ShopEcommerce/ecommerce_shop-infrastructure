# Traefik Configuration
# API Gateway 

api:
  # Insecure API (only for development)
  insecure: true
  dashboard: true

entryPoints:
  web:
    address: ':80'

providers:
  docker:
    endpoint: 'unix:///var/run/docker.sock'
    exposedByDefault: false
    network: teleshop-network
  file:
    directory: /etc/traefik/dynamic
    watch: true

# Global configuration
global:
  checkNewVersion: true
  sendAnonymousUsage: false

log:
  level: INFO
  format: json

accessLog:
  format: json
